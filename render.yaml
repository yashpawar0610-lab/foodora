services:
  - type: web
    name: foodora-food-delivery
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        value: foodora_secret_key_2026_delivery_platform
      - key: NODE_ENV
        value: production
